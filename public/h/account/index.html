<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Profile | 123 ABC Pro</title>
  <link rel="stylesheet" href="/h/support-page.css">
</head>
<body>
  <header class="support-toolbar">
    <a class="support-back" href="/" aria-label="Back to activities">←</a>
    <a class="support-brand" href="/">123 ABC Pro</a>
  </header>
  <main class="support-main">
    <h1>Local profile</h1>
    <p class="support-lead">Your name, access setting, and activity progress stay in this browser. No external account is required.</p>
    <section class="support-section" aria-labelledby="profile-heading">
      <h2 id="profile-heading">Player settings</h2>
      <form id="local-profile-form" class="support-form">
        <label class="field-label" for="profile-name">Player name
          <input id="profile-name" type="text" maxlength="24" autocomplete="nickname">
        </label>
        <label class="toggle-label" for="full-access">
          <input id="full-access" type="checkbox"> Full Access
        </label>
        <div class="support-actions">
          <button class="support-button" type="submit">Save</button>
          <button id="reset-progress" class="support-button danger" type="button">Reset progress</button>
        </div>
        <p id="profile-status" class="support-status" role="status" aria-live="polite"></p>
      </form>
    </section>
    <nav class="support-nav support-links" aria-label="Support links">
      <a class="support-link secondary" href="/h/help/index.html">Help</a>
      <a class="support-link secondary" href="/h/accessibility/index.html">Accessibility</a>
      <a class="support-link" href="/">Activities</a>
    </nav>
  </main>
  <script src="/h/support-page.js"></script>
</body>
</html>
